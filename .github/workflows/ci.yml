name: CI

# Gate rápido (sin red externa): lint + type-check + pruebas unitarias/integración.
# Corre en cada push a las ramas del flujo y en cada PR hacia ellas.
on:
  push:
    branches: [test, develop, main]
  pull_request:
    branches: [test, develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Type-check · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Guard de variables de entorno (HU-364)
        run: node scripts/check-env-docs.mjs

      - name: Type-check
        run: pnpm turbo run type-check

      - name: Lint
        run: pnpm turbo run lint

      - name: Pruebas unitarias / integración
        run: pnpm turbo run test
